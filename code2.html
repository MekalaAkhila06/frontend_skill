<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid</title>

    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 500px;
            margin: 50px auto;
        }

        .box {
            background-color: lightgreen;
            padding: 40px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h2 style="text-align:center;">CSS Grid</h2>

    <div class="grid">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>

</body>
</html>
